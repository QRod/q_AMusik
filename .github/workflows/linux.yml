name: Linux
on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'research/') }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          if [ '${{ matrix.os }}' = 'ubuntu-24.04' ]; then
            qt_engine_package=python3-pyqt6.qtwebengine
          else
            qt_engine_package=python3-pyqt5.qtwebengine
          fi
          sudo apt-get install -y "$qt_engine_package" python3-gi python3-gi-cairo python3-mutagen gir1.2-gtk-3.0 gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-pulseaudio xdg-utils xvfb dbus-x11 desktop-file-utils imagemagick
      - name: Pruebas de lógica
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Interfaz y reproducción sin dispositivo físico
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1200x24' /usr/bin/python3 tests/native-smoke.py
      - name: Ventana integrada y control de audio
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1200x24' /usr/bin/python3 tests/desktop-smoke.py
      - name: Construir paquete Debian
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          /usr/bin/python3 packaging/build-deb.py
          cd dist
          sha256sum *.deb > SHA256SUMS
      - name: Instalar paquete y comprobar metadatos
        run: |
          sudo apt-get install -y ./dist/*.deb
          dpkg-query --show q-amusik
          desktop-file-validate /usr/share/applications/io.github.qrod.qAMusik.desktop
      - name: Verificar paquete instalado y lanzador
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1200x24' /usr/bin/python3 tests/native-smoke.py --installed
          dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1200x24' /usr/bin/python3 tests/desktop-smoke.py --installed
          dbus-run-session -- xvfb-run -a q-amusik --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: q-amusik-${{ matrix.os }}
          path: |
            dist/*.deb
            dist/SHA256SUMS
            validation/*.png
            validation/manifest.json
  research-player:
    # La investigación se dispara manualmente; también se reconoce en PR.
    if: startsWith(github.head_ref || github.ref_name, 'research/')
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            qt: '5'
            package: python3-pyqt5.qtwebengine
          - os: ubuntu-24.04
            qt: '6'
            package: python3-pyqt6.qtwebengine
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar motor de diagnóstico
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.package }} xvfb
      - name: Comprobar prerrequisitos, sin cuenta ni licencia Apple
        run: xvfb-run -a -s '-screen 0 1280x800x24' /usr/bin/python3 research/probe_player.py --qt '${{ matrix.qt }}' --output validation/player-capabilities.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: player-capabilities-${{ matrix.os }}
          path: validation/player-capabilities.json
